# Read by stm32-installer. See https://github.com/nimaltd/stm32-installer
#
# There is no version here. The installer reads it from the @version tag in
# ee24.h, so the source files are the only place it is written.

name: ee24
description: Driver for 24xx I2C EEPROMs, 24C01 to 24C512, on the STM32 HAL
repository: https://github.com/nimaltd/ee24
license: Apache-2.0

# What this library is.
# kind:     driver, middleware, rtos, protocol, filesystem, utility, bsp
# category: sensor, storage, display, communication, wireless, rtos, timing,
#           power, input, math, system
kind: driver
category: storage

# Capabilities this library gives other libraries. An RTOS would say [rtos].
provides: []

# What the project has to offer before this library works.
requires:
  installer: 1.5.0    # the first that installs the libraries listed below
  libraries:
    - nimaltd/osal >= 1.0.0   # the mutex and the waits, bare metal or RTOS
  hal: true           # HAL I2C, GPIO and the tick
  cmsis: false
  rtos: optional      # none, or FreeRTOS or ThreadX, set in osal_config.h
  hal_modules: [i2c]  # must be enabled in stm32xxxx_hal_conf.h
  peripherals:
    - type: i2c
      count: 1
      note: 7 bit addressing, standard or fast mode
  c_standard: c11

# The code keeps its src/ folder in the user's project, just as it sits here.
install:
  layout: mirror

files:
  headers:
    - src/ee24.h
  sources:
    - src/ee24.c

# Copied as they are, alongside the code.
extras:
  - LICENSE.md
  - NOTICE
  - README.md
  - CHANGELOG.md
